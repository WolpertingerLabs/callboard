name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # Lint, format and dependency checks don't depend on the Node version, so
  # they run once, on the engines floor's major.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # NODE_ENV=development so npm does not strip devDependencies (tsc, eslint,
      # vitest, vite). --include=dev belt-and-braces for the same reason.
      - name: Install
        run: NODE_ENV=development npm ci --include=dev

      # The typed lint resolves workspace packages through their built dist/.
      - name: Build
        run: npm run build

      # `lint` only lints staged files (it's the pre-commit hook); in CI there
      # are none, so we run lint:all to actually lint the codebase.
      - name: Lint
        run: npm run lint:all

      # drawlatch keeps its own typed eslint config (packages/drawlatch is
      # ignored by the root config), so it is linted from its own directory.
      - name: Lint drawlatch
        run: npm run lint:drawlatch

      # prettier/prettier is only a warning in drawlatch's eslint config, so
      # formatting drift would never fail the lint step above.
      - name: Format check drawlatch
        run: npm run format:drawlatch:check

      # Published deps + version lockstep (every versioned package, the
      # drawlatch pins and both lockfiles equal the root version).
      - name: Published deps + lockstep
        run: npm run deps:check

  # Install, build and the full test suite on every supported Node: the exact
  # engines.node floor (package.json) and the two newest LTS majors.
  # Each bundled npm does the install, so lockfile drift between npm majors
  # shows up here too. Coverage is reported from one leg only.
  build-test:
    name: build-test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["22.19.0", "24", "26"]
        include:
          - node: "24"
            coverage: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Versions
        run: node --version && npm --version

      - name: Install
        run: NODE_ENV=development npm ci --include=dev

      - name: Build
        run: npm run build

      - name: Test
        if: ${{ !matrix.coverage }}
        run: npm test

      # test:coverage runs the computer-use and drawlatch suites, then the full
      # vitest suite (so a failing test gates CI) AND produces the coverage
      # report. Coverage has no thresholds configured, so low numbers never fail
      # the build — coverage is reported, not enforced. That is why this leg
      # has no separate `npm test`.
      - name: Test + coverage
        if: ${{ matrix.coverage }}
        run: npm run test:coverage

      # Surface the coverage totals in the run summary. Non-gating: it runs even
      # if earlier steps failed and never fails the job itself.
      - name: Coverage summary
        if: ${{ always() && matrix.coverage }}
        continue-on-error: true
        run: |
          node -e '
            const fs = require("fs");
            const p = "coverage/coverage-summary.json";
            if (!fs.existsSync(p)) { console.log("No coverage summary found."); process.exit(0); }
            const t = JSON.parse(fs.readFileSync(p, "utf8")).total;
            const row = (k) => `| ${k[0].toUpperCase()+k.slice(1)} | ${t[k].pct}% | ${t[k].covered}/${t[k].total} |`;
            const md = [
              "## Coverage (non-gating)",
              "",
              "| Metric | % | Covered/Total |",
              "| --- | --- | --- |",
              row("lines"),
              row("statements"),
              row("branches"),
              row("functions"),
              "",
              "_Coverage is reported for visibility only and does not gate the build._",
              "",
            ].join("\n");
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, md);
          '

      # Keep the full HTML/lcov report as a downloadable artifact. Non-gating.
      - name: Upload coverage report
        if: ${{ always() && matrix.coverage }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          if-no-files-found: ignore
